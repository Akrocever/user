<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inversión</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Script de Validación de Sesión y Protección -->
  <script>
    const supabaseUrl = 'https://atiihfgjbpvtjglestyw.supabase.co'; 
    const supabaseKey = 'sb_publishable_CpzuF8Op8fYh_9znf-tHXg_Ba9xNMnP'; 
    const URL_LOGIN   = 'https://akrocever.github.io/user/login.html';

    async function protegerSubpagina() {
      // 1. Evitar que la subpágina se abra fuera del iframe
      if (window === window.top) {
        window.top.location.href = URL_LOGIN;
        return;
      }

      // 2. Verificar que la librería de Supabase esté disponible
      if (!window.supabase || !window.supabase.createClient) {
        window.top.location.href = URL_LOGIN;
        return;
      }

      const clientSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

      try {
        const { data: { session }, error } = await clientSupabase.auth.getSession();

        if (error || !session) {
          // Si no hay sesión de Supabase iniciada, enviar a Login fuera del iframe
          window.top.location.href = URL_LOGIN;
        } else {
          // Si el usuario está autenticado, mostrar el contenido
          document.body.style.display = 'block';
        }
      } catch (err) {
        console.error('Error al validar sesión:', err);
        window.top.location.href = URL_LOGIN;
      }
    }

    document.addEventListener('DOMContentLoaded', protegerSubpagina);
  </script>
  
    <style>
        body { font-family: 'Lexend', sans-serif; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
    </style>
</head>

    <!-- Contenedor Principal con el iframe dinámico -->
