<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Oficina Virtual</title>
    
    <!-- Librerías de Estilo e Iconos -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Lexend', sans-serif; }
    </style>

    <script>
        // Configuración de Supabase
        const supabaseUrl = 'https://atiihfgjbpvtjglestyw.supabase.co'; 
        const supabaseKey = 'sb_publishable_CpzuF8Op8fYh_9znf-tHXg_Ba9xNMnP'; 

        // Variable global para la instancia del cliente
        let clientSupabase = null;

        // Inicialización segura del cliente
        function initSupabase() {
            if (window.supabase && window.supabase.createClient) {
                clientSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);
            }
        }

        // Buscar la carpeta privada en la tabla de Supabase y redirigir a office.html
        async function obtenerYRedirigir(email) {
            if (!clientSupabase) initSupabase();

            try {
                const { data, error } = await clientSupabase
                    .from('usuarios_paginas')
                    .select('pagina_privada')
                    .eq('email', email)
                    .maybeSingle();

                if (error) {
                    alert('Error en la base de datos: ' + error.message);
                    return;
                }

                if (!data || !data.pagina_privada) {
                    alert('No se encontró una página privada registrada para: ' + email);
                    return;
                }

                const carpeta = data.pagina_privada.trim(); // Ej: "id", "id01", "id02"

                // Si por alguna razón la celda traía la URL completa
                if (carpeta.startsWith('http')) {
                    window.location.href = carpeta;
                } else {
                    // Arma la URL correcta apuntando al archivo office.html dentro de su carpeta
                    window.location.href = `https://akrocever.github.io/user/${carpeta}/office.html`;
                }

            } catch (err) {
                alert('Ocurrió un error inesperado al redirigir: ' + err.message);
            }
        }

        // Si ya hay una sesión activa, redirigir automáticamente
        async function redirigirSiYaInicioSesion() {
            initSupabase();
            if (!clientSupabase) return;

            try {
                const { data: { session } } = await clientSupabase.auth.getSession();
                if (session && session.user && session.user.email) {
                    await obtenerYRedirigir(session.user.email);
                }
            } catch (e) {
                console.log("Sin sesión activa previa.");
            }
        }

        // Función que procesa el formulario de login
        async function manejarLogin(event) {
            event.preventDefault();
            
            const btnLogin = document.getElementById('btnLogin');
            const errorMsg = document.getElementById('errorMsg');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!clientSupabase) initSupabase();

            if (!clientSupabase) {
                alert('No se pudo conectar con los servicios de Supabase. Revisa tu conexión.');
                return;
            }

            btnLogin.disabled = true;
            btnLogin.innerText = 'Validando...';
            errorMsg.classList.add('hidden');

            try {
                // 1. Iniciar sesión en Supabase Auth
                const { data, error } = await clientSupabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    errorMsg.innerText = 'Error: ' + error.message;
                    errorMsg.classList.remove('hidden');
                    btnLogin.disabled = false;
                    btnLogin.innerText = 'Iniciar Sesión';
                } else {
                    btnLogin.innerText = 'Cargando tu página...';
                    // 2. Redirigir a la URL privada correspondiente
                    await obtenerYRedirigir(email);
                }
            } catch (err) {
                alert('Error al iniciar sesión: ' + err.message);
                btnLogin.disabled = false;
                btnLogin.innerText = 'Iniciar Sesión';
            }
        }

        document.addEventListener('DOMContentLoaded', redirigirSiYaInicioSesion);
    </script>
</head>

<body class="bg-[#f4f6f8] min-h-screen flex flex-col justify-between text-slate-800 m-0">

    <!-- Encabezado Fijo Superior Estilo Referencia -->
    <header class="bg-[#0f172a] text-white fixed top-0 left-0 right-0 h-16 shadow-xl z-50 px-4 md:px-8 flex items-center justify-between border-b border-slate-800">
        <!-- Contenedor principal del perfil -->
        <div class="flex items-center gap-3">
            <!-- Imagen de perfil con borde blanco circular -->
            <img src="https://i.ibb.co/992JfSrK/Picsart-25-11-16-15-15-55-437.png" alt="Perfil" class="w-10 h-10 rounded-full border-2 border-white object-cover shadow-sm">
            
            <!-- Contenedor de los textos -->
            <div class="flex flex-col justify-center">
                <!-- Primera línea: ID y ¡Hola! -->
                <div class="flex items-center gap-2">
                    <span class="text-cyan-400 text-sm font-bold" style="font-family: 'Orbitron', sans-serif;">Hola!</span>
                    <span class="text-white text-sm font-normal" style="font-family: 'Lexend', sans-serif;">Bienvenido/a!</span>
                </div>
                
                <!-- Segunda línea: Nombre -->
                <span class="text-blue-400 text-base font-bold leading-tight" style="font-family: 'Orbitron', sans-serif;">a Akrocever</span>
            </div>
        </div>

        <!-- Botón único de usuario simulando estado seleccionado -->
        <nav class="flex items-center space-x-3 md:space-x-5">
            <div class="flex items-center justify-center w-10 h-10 md:w-12 md:h-12 rounded-full border-2 border-cyan-400 bg-slate-800 text-white shadow-md shadow-cyan-900/50 cursor-default" title="Usuario (Seleccionado)">
                <i class="fa-solid fa-user text-base md:text-lg text-cyan-400"></i>
            </div>
        </nav>       
    </header>

    <!-- Contenedor Principal (Login Centrado con pt-24 para compensar el header fijo de 4rem/16) -->
    <div class="flex-grow flex flex-col items-center justify-center p-4 pt-24">
        <div class="bg-white border-2 border-[#3f94c2] rounded-2xl shadow-xl p-6 md:p-8 w-full max-w-md">
            
            <!-- Encabezado / Logo y Título -->
            <div class="text-center mb-6 flex flex-col items-center">
                <!-- Logotipo Circular -->
                <div class="w-20 h-20 rounded-full border-2 border-[#3f94c2] overflow-hidden flex items-center justify-center mb-3 shadow-md bg-slate-50">
                    <img src="https://i.ibb.co/992JfSrK/Picsart-25-11-16-15-15-55-437.png" alt="Logo" class="w-full h-full object-cover">
                </div>

                <h1 class="text-2xl font-bold tracking-wider mb-1 text-[#003366]" style="font-family: 'Orbitron', sans-serif;">
                    INICIAR SESIÓN
                </h1>
                <p class="text-slate-500 text-sm">Ingresa tus credenciales para acceder</p>
            </div>

            <!-- Formulario -->
            <form onsubmit="manejarLogin(event)" class="space-y-4">
                
                <!-- Campo Correo -->
                <div>
                    <label for="email" class="block text-xs font-semibold uppercase text-slate-600 mb-1">Correo Electrónico</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" id="email" required placeholder="tu@correo.com" 
                               class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:border-[#3f94c2] text-sm text-slate-800 placeholder-slate-400 transition-colors">
                    </div>
                </div>

                <!-- Campo Contraseña -->
                <div>
                    <label for="password" class="block text-xs font-semibold uppercase text-slate-600 mb-1">Contraseña</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" required placeholder="••••••••" 
                               class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:border-[#3f94c2] text-sm text-slate-800 placeholder-slate-400 transition-colors">
                    </div>
                </div>

                <!-- Mensaje de Error -->
                <div id="errorMsg" class="hidden text-red-600 text-xs bg-red-50 border border-red-200 p-2.5 rounded-lg text-center"></div>

                <!-- Botón Ingresar -->
                <button type="submit" id="btnLogin" 
                        class="w-full py-3 bg-[#003366] hover:bg-[#3f94c2] text-white font-semibold rounded-xl shadow-lg shadow-[#003366]/20 transition-all duration-200 cursor-pointer active:scale-95 text-sm">
                    Iniciar Sesión
                </button>

            </form>
        </div>

        <!-- Texto inferior de WhatsApp -->
        <div class="mt-6 text-center max-w-md px-4">
            <p class="text-xs text-slate-500 leading-relaxed font-light">
                Si aún no tienes acceso, comunícate con nuestro equipo a través de WhatsApp al <span class="font-medium text-slate-700">8117967047</span> para solicitar tu registro.
            </p>
        </div>
    </div>

    <!-- Pie de página (Footer) con fondo #003366 -->
    <footer class="bg-[#003366] text-white text-center py-3 px-4 w-full">
        <div class="max-w-4xl mx-auto space-y-1">
            <p class="text-xs md:text-sm font-light">
                © Akrocever 2026 | Proyecto independiente impulsado por IA
            </p>
            <p class="text-xs md:text-sm font-light">
                Todos los derechos reservados.
            </p>
        </div>
    </footer>

</body>
</html>
