<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Oficina Virtual</title>
    
    <!-- Librerías de Estilo e Iconos -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Lexend', sans-serif; }
    </style>

    <script>
        // Configuración de Supabase
        const supabaseUrl = 'https://atiihfgjbpvtjglestyw.supabase.co'; 
        const supabaseKey = 'sb_publishable_CpzuF8Op8fYh_9znf-tHXg_Ba9xNMnP'; 

        // Variable global para la instancia del cliente
        let clientSupabase = null;

        // Inicialización segura del cliente
        function initSupabase() {
            if (window.supabase && window.supabase.createClient) {
                clientSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);
            }
        }

        // Buscar la URL privada en la tabla de Supabase y redirigir
        async function obtenerYRedirigir(email) {
            if (!clientSupabase) initSupabase();

            try {
                const { data, error } = await clientSupabase
                    .from('usuarios_paginas')
                    .select('pagina_privada')
                    .eq('email', email)
                    .maybeSingle();

                if (error) {
                    alert('Error en la base de datos: ' + error.message);
                    return;
                }

                if (!data || !data.pagina_privada) {
                    alert('No se encontró una página privada registrada para: ' + email);
                    return;
                }

                // Redirección exitosa
                window.location.href = data.pagina_privada;
            } catch (err) {
                alert('Ocurrió un error inesperado al redirigir: ' + err.message);
            }
        }

        // Si ya hay una sesión activa, redirigir automáticamente
        async function redirigirSiYaInicioSesion() {
            initSupabase();
            if (!clientSupabase) return;

            try {
                const { data: { session } } = await clientSupabase.auth.getSession();
                if (session && session.user && session.user.email) {
                    await obtenerYRedirigir(session.user.email);
                }
            } catch (e) {
                console.log("Sin sesión activa previa.");
            }
        }

        // Función que procesa el formulario de login
        async function manejarLogin(event) {
            event.preventDefault();
            
            const btnLogin = document.getElementById('btnLogin');
            const errorMsg = document.getElementById('errorMsg');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!clientSupabase) initSupabase();

            if (!clientSupabase) {
                alert('No se pudo conectar con los servicios de Supabase. Revisa tu conexión.');
                return;
            }

            btnLogin.disabled = true;
            btnLogin.innerText = 'Validando...';
            errorMsg.classList.add('hidden');

            try {
                // 1. Iniciar sesión en Supabase Auth
                const { data, error } = await clientSupabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    errorMsg.innerText = 'Error: ' + error.message;
                    errorMsg.classList.remove('hidden');
                    btnLogin.disabled = false;
                    btnLogin.innerText = 'Iniciar Sesión';
                } else {
                    btnLogin.innerText = 'Cargando tu página...';
                    // 2. Redirigir a la URL privada
                    await obtenerYRedirigir(email);
                }
            } catch (err) {
                alert('Error al iniciar sesión: ' + err.message);
                btnLogin.disabled = false;
                btnLogin.innerText = 'Iniciar Sesión';
            }
        }

        document.addEventListener('DOMContentLoaded', redirigirSiYaInicioSesion);
    </script>
</head>

<body class="bg-[#0f172a] min-h-screen flex items-center justify-center p-4 text-white">

    <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 md:p-8 w-full max-w-md">
        
        <!-- Encabezado / Logo -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-400 tracking-wider mb-1" style="font-family: 'Orbitron', sans-serif;">
                OFICINA VIRTUAL
            </h1>
            <p class="text-slate-400 text-sm">Ingresa tus credenciales para acceder</p>
        </div>

        <!-- Formulario -->
        <form onsubmit="manejarLogin(event)" class="space-y-4">
            
            <!-- Campo Correo -->
            <div>
                <label for="email" class="block text-xs font-semibold uppercase text-slate-300 mb-1">Correo Electrónico</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" id="email" required placeholder="tu@correo.com" 
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl focus:outline-none focus:border-blue-500 text-sm text-white placeholder-slate-500 transition-colors">
                </div>
            </div>

            <!-- Campo Contraseña -->
            <div>
                <label for="password" class="block text-xs font-semibold uppercase text-slate-300 mb-1">Contraseña</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" required placeholder="••••••••" 
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl focus:outline-none focus:border-blue-500 text-sm text-white placeholder-slate-500 transition-colors">
                </div>
            </div>

            <!-- Mensaje de Error -->
            <div id="errorMsg" class="hidden text-red-400 text-xs bg-red-950/50 border border-red-900 p-2.5 rounded-lg text-center"></div>

            <!-- Botón Ingresar -->
            <button type="submit" id="btnLogin" 
                    class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition-all duration-200 cursor-pointer active:scale-95 text-sm">
                Iniciar Sesión
            </button>

        </form>
    </div>

</body>
</html>
