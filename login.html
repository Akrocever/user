<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Conexión</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background-color: #111; color: white; padding: 20px; font-family: sans-serif;">

    <h2>Prueba de Conexión a Supabase</h2>
    
    <button onclick="probar()" style="padding: 15px 25px; font-size: 16px;">PRESIONA AQUÍ PARA PROBAR</button>

    <div id="log" style="margin-top: 20px; color: #00ff88; font-family: monospace;"></div>

    <script>
        function log(msg) {
            document.getElementById('log').innerHTML += msg + '<br><br>';
        }

        async function probar() {
            log("1. Botón presionado correctamente.");

            if (!window.supabase) {
                log("❌ ERROR: La librería de Supabase no cargó. Revisa tu internet.");
                return;
            }

            log("2. Librería de Supabase cargada.");

            const url = 'https://atiihfgjbpvtjglestyw.supabase.co';
            // Reemplaza comillas si es necesario con tu anon key de Supabase:
            const key = 'sb_publishable_CpzuF8Op8fYh_9znf-tHXg_Ba9xNMnP'; 

            const client = window.supabase.createClient(url, key);

            log("3. Intentando consultar la tabla usuarios_paginas...");

            const { data, error } = await client.from('usuarios_paginas').select('*');

            if (error) {
                log("❌ Error de Supabase: " + error.message);
            } else {
                log("✅ ¡Conexión Exitosa! Datos recibidos: " + JSON.stringify(data));
            }
        }
    </script>
</body>
</html>
