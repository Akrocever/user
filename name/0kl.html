<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akrocever - Reclutador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- SDK oficial de Supabase v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Lexend', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center px-4">

    <!-- FORMULARIO DE ACCESO -->
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
        <div class="text-center mb-6">
            <img src="https://i.ibb.co/TM6Q259h/IMG-20260623-205941-812.jpg" alt="Logo" class="w-16 h-16 mx-auto rounded-full border-2 border-blue-500 mb-2">
            <h2 class="text-2xl font-bold text-slate-800" style="font-family: 'Orbitron', sans-serif;">
                Akrocever <span class="text-[#3f94c2]">Reclutador</span>
            </h2>
            <p class="text-xs text-gray-500 mt-1">Ingresa tus credenciales para acceder</p>
        </div>

        <form id="form-login" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="usuario@correo.com" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            
            <button type="submit" id="btn-submit" class="w-full bg-[#0f172a] hover:bg-slate-800 text-white font-bold py-2.5 rounded-lg transition duration-200 text-sm shadow-md cursor-pointer">
                Iniciar Sesión
            </button>
        </form>

        <p id="mensaje-estado" class="text-xs text-center mt-3 hidden p-2 rounded-lg"></p>
    </div>

    <script>
        const SUPABASE_URL = 'https://atiihfgjbpvtjglestyw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_CpzuF8Op8fYh_9znf-tHXg_Ba9xNMnP';
        
        // Inicialización correcta de Supabase
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const formLogin = document.getElementById('form-login');
        const mensajeEstado = document.getElementById('mensaje-estado');
        const btnSubmit = document.getElementById('btn-submit');
        const PAGINA_DEFECTO = 'https://akrocever.github.io/Sistema/Emp/0Encbzdo.html';

        // Comprobar si ya hay una sesión activa
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                await redirigirUsuario(session.user.email);
            }
        });

        // Evento al presionar Iniciar Sesión
        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            ocultarMensaje();

            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            btnSubmit.disabled = true;
            mostrarMensaje("Verificando datos...", "bg-blue-100 text-blue-700");

            // 1. Iniciar sesión en Supabase Auth
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            btnSubmit.disabled = false;

            if (error) {
                mostrarMensaje("Error: " + error.message, "bg-red-100 text-red-700");
                alert("Error al iniciar sesión: " + error.message);
            } else {
                await redirigirUsuario(data.user.email);
            }
        });

        // Función para consultar la URL personalizada y redirigir
        async function redirigirUsuario(email) {
            mostrarMensaje("Cargando tu página...", "bg-blue-100 text-blue-700");

            const emailLimpio = email.trim().toLowerCase();

            // Consultar la tabla usuarios_paginas
            const { data, error } = await supabaseClient
                .from('usuarios_paginas')
                .select('pagina_privada')
                .eq('email', emailLimpio)
                .maybeSingle();

            if (error) {
                console.error("Error consultando tabla:", error);
                alert("Error de consulta: " + error.message);
            }

            // Redireccionar a la página encontrada o a la por defecto
            const urlFinal = data?.pagina_privada || PAGINA_DEFECTO;
            window.location.href = urlFinal;
        }

        function mostrarMensaje(texto, clases) {
            mensajeEstado.textContent = texto;
            mensajeEstado.className = `text-xs text-center mt-3 p-2 rounded-lg ${clases}`;
            mensajeEstado.classList.remove('hidden');
        }

        function ocultarMensaje() {
            mensajeEstado.classList.add('hidden');
        }
    </script>
</body>
</html>
