<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akrocever - Reclutador</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Lexend', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- =================================================== -->
    <!-- 1. FORMULARIO DE ACCESO (LOGIN)                     -->
    <!-- =================================================== -->
    <div id="seccion-login" class="flex items-center justify-center min-h-screen px-4 bg-slate-900">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
            <div class="text-center mb-6">
                <img src="https://i.ibb.co/TM6Q259h/IMG-20260623-205941-812.jpg" alt="Logo" class="w-16 h-16 mx-auto rounded-full border-2 border-blue-500 mb-2">
                <h2 class="text-2xl font-bold text-slate-800" style="font-family: 'Orbitron', sans-serif;">
                    Akrocever <span class="text-[#3f94c2]">Reclutador</span>
                </h2>
                <p class="text-xs text-gray-500 mt-1">Ingresa tus credenciales para acceder</p>
            </div>

            <form id="form-login" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="usuario@correo.com" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                
                <button type="submit" id="btn-submit" class="w-full bg-[#0f172a] hover:bg-slate-800 text-white font-bold py-2.5 rounded-lg transition duration-200 text-sm shadow-md cursor-pointer">
                    Iniciar Sesión
                </button>
            </form>

            <p id="mensaje-estado" class="text-xs text-center mt-3 hidden p-2 rounded-lg"></p>
        </div>
    </div>


    <!-- =================================================== -->
    <!-- 2. CONTENIDO PROTEGIDO                              -->
    <!-- =================================================== -->
    <div id="contenido-protegido" class="hidden flex-col pt-15 min-h-screen">

        <header class="bg-[#0f172a] text-white fixed top-0 left-0 right-0 h-[60px] shadow-xl z-50 px-4 md:px-8 flex items-center justify-between border-b border-slate-800">
            
            <div class="flex items-center space-x-3">
                <img src="https://i.ibb.co/TM6Q259h/IMG-20260623-205941-812.jpg" 
                     alt="Foto de perfil" 
                     class="w-10 h-10 md:w-12 md:h-12 rounded-full object-cover border-2 border-blue-500 shadow-sm">
                
                <span class="text-sm md:text-lg font-bold tracking-wider" style="font-family: 'Orbitron', sans-serif;">
                    Akrocever <span class="text-[#3f94c2]">Reclutador</span>
                </span>
            </div>

            <nav class="flex items-center space-x-3 md:space-x-5">
                <a href="https://wa.me/528126309200" target="_blank" 
                   class="flex items-center justify-center w-10 h-10 md:w-12 md:h-12 rounded-full border border-gray-400 text-gray-600 hover:text-white hover:bg-green-600 hover:border-green-600 transition-all duration-150 ease-in-out group active:scale-90 focus:outline-none" 
                   title="Contactar por WhatsApp">
                    <i class="fa-brands fa-whatsapp text-lg md:text-xl text-green-600 group-hover:text-white group-hover:scale-110 transition-transform"></i>
                </a>

                <button id="btn-logout" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-md transition font-semibold cursor-pointer">
                    Salir
                </button>
            </nav>
        </header>

        <main class="flex-grow w-full h-[calc(100vh-60px)] overflow-hidden">
            <iframe name="contenedor-virtual" src="https://akrocever.github.io/Sistema/Emp/0Encbzdo.html" class="w-full h-full border-none" title="Contenido de Oficina Virtual"></iframe>
        </main>

    </div>


    <!-- =================================================== -->
    <!-- 3. LÓGICA DE AUTENTICACIÓN                         -->
    <!-- =================================================== -->
    <script>
        const SUPABASE_URL = 'https://atiihfgjbpvtjglestyw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_CpzuF8Op8fYh_9znf-tHXg_Ba9xNMnP';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const seccionLogin = document.getElementById('seccion-login');
        const contenidoProtegido = document.getElementById('contenido-protegido');
        const formLogin = document.getElementById('form-login');
        const mensajeEstado = document.getElementById('mensaje-estado');
        const btnSubmit = document.getElementById('btn-submit');

        // Verificar sesión activa al entrar
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            mostrarVista(session);
        });

        // Evento Iniciar Sesión
        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            ocultarMensaje();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btnSubmit.disabled = true;
            mostrarMensaje("Verificando datos...", "bg-blue-100 text-blue-700");

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            btnSubmit.disabled = false;

            if (error) {
                mostrarMensaje("Error: " + error.message, "bg-red-100 text-red-700");
            } else {
                mostrarVista(data.session);
            }
        });

        // Evento Cerrar Sesión
        document.getElementById('btn-logout').addEventListener('click', async () => {
            await supabase.auth.signOut();
            mostrarVista(null);
        });

        function mostrarVista(session) {
            if (session) {
                seccionLogin.classList.add('hidden');
                contenidoProtegido.classList.remove('hidden');
                contenidoProtegido.classList.add('flex');
            } else {
                seccionLogin.classList.remove('hidden');
                contenidoProtegido.classList.add('hidden');
                contenidoProtegido.classList.remove('flex');
            }
        }

        function mostrarMensaje(texto, clases) {
            mensajeEstado.textContent = texto;
            mensajeEstado.className = `text-xs text-center mt-3 p-2 rounded-lg ${clases}`;
            mensajeEstado.classList.remove('hidden');
        }

        function ocultarMensaje() {
            mensajeEstado.classList.add('hidden');
        }
    </script>
</body>
</html>
