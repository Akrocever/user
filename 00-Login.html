<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Lexend', sans-serif;
      background: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between; 
      min-height: 100vh;
      padding-top: 10px; 
      padding-bottom: 0;
    }

    .main-wrapper {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      flex: 1;
    }

    /* 🔹 REGLA GLOBAL PARA IMÁGENES */
    img {
      max-width: 100%; /* No permite que la imagen sea más ancha que su contenedor */
      height: auto;    /* Mantiene la proporción */
      display: block;
      margin: 0 auto;  /* Centra la imagen */
    }

    /* 🔹 ESTILO GENERAL DE TARJETAS */
    .section-card {
      background: #ffffff;
      border-radius: 10px;
      margin-bottom: 5px;
    }

    /* 🔹 TARJETA DE LOGIN */
    .login-card {
      border: 4px solid #3f8fb4; 
      box-shadow: 0 0 15px rgba(63, 143, 180, 0.3);
      overflow: hidden; 
    }

    /* 🔹 ENCABEZADO */
    .header {
      background: #003366; 
      color: #fff;
      text-align: center;
      font-size: 18px;
      padding: 10px;
      font-family: 'Orbitron', sans-serif;
    }

    /* 🔹 SEPARADOR */
    .separador {
      border: 0;
      height: 2px;
      background: #d1d5db;
      margin: 25px auto;
      width: 95%;
    }

    .login-body {
      padding: 20px;
    }

    .login-body label {
      font-size: 15px;
      margin-bottom: 5px;
      display: block;
      color: #333;
    }

    .login-body input {
      width: 100%;
      padding: 10px;
      border: 2px solid #3f8fb4; 
      margin-bottom: 12px;
      border-radius: 5px;
      font-family: 'Lexend', sans-serif;
    }

    .login-body button {
      width: 100%;
      padding: 10px;
      background: #3f8fb4; 
      color: #fff;
      border: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      border-radius: 5px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    /* ✨ EFECTO ESPEJO */
    .login-body button::after {
      content: "";
      position: absolute;
      top: 0; left: -75%;
      width: 50%; height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
      transform: skewX(-25deg);
      animation: brillo 2.5s infinite;
    }

    @keyframes brillo {
      0% { left: -75%; }
      100% { left: 125%; }
    }

    /* 🔹 CONTENEDOR DE LA IMAGEN INFERIOR */
    .image-container {
      margin-top: 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    .image-container img {
      border-radius: 8px; /* Redondea suavemente las esquinas de la imagen */
    }

    /* 🔹 PIE DE PÁGINA (FOOTER) */
    footer {
      width: 100%;
      background-color: #003366; /* Azul oscuro igual al encabezado */
      color: #ffffff;
      text-align: center;
      padding: 20px 10px;
      font-size: 13px;
      line-height: 1.6;
    }

    footer p {
      margin: 2px 0;
    }

  </style>
</head>
<body>

  <div class="main-wrapper">
    
    <!-- TARJETA DE LOGIN -->
    <div class="section-card login-card">
      <div class="header">OFICINA VIRTUAL</div>
      <div class="login-body">
        <form method="post" action="https://www.authpro.com/auth/Akrocever1/">
          <input type="hidden" name="action" value="login">
          <input type="hidden" name="user" value="Akrocever1">

          <label>Usuario</label>
          <input type="text" name="login" required>

          <label>Contraseña</label>
          <input type="password" name="password" required>

          <button type="submit">Acceder</button>
        </form>
      </div>
    </div>

    <hr class="separador">

    <!-- IMAGEN DEBAJO DEL LOGIN -->
    <div class="image-container">
      <img src="https://i.ibb.co/hRdrqtfh/Picsart-26-05-30-20-21-36-686.jpg" alt="Imagen descriptiva">
    </div>

  </div>

  <!-- PIE DE PÁGINA -->
  <footer>
    <p>© Akrocever 2026 | Proyecto independiente impulsado por IA</p>
    <p>Todos los derechos reservados.</p>
  </footer>

</body>
</html>
