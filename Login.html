<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Akrocever - Oficina Virtual</title>

  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- SDK oficial de Supabase v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Lexend', sans-serif;
      background: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between; 
      min-height: 100vh;
      padding-top: 10px; 
      padding-bottom: 0;
    }

    .main-wrapper {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      flex: 1;
    }

    /* 🔹 REGLA GLOBAL PARA IMÁGENES */
    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* 🔹 ESTILO GENERAL DE TARJETAS */
    .section-card {
      background: #ffffff;
      border-radius: 10px;
      margin-bottom: 5px;
    }

    /* 🔹 TARJETA DE LOGIN */
    .login-card {
      border: 4px solid #3f8fb4; 
      box-shadow: 0 0 15px rgba(63, 143, 180, 0.3);
      overflow: hidden; 
    }

    /* 🔹 ENCABEZADO */
    .header {
      background: #003366; 
      color: #fff;
      text-align: center;
      font-size: 18px;
      padding: 10px;
      font-family: 'Orbitron', sans-serif;
    }

    /* 🔹 SEPARADOR */
    .separador {
      border: 0;
      height: 2px;
      background: #d1d5db;
      margin: 25px auto;
      width: 95%;
    }

    .login-body {
      padding: 20px;
    }

    .login-body label {
      font-size: 15px;
      margin-bottom: 5px;
      display: block;
      color: #333;
    }

    .login-body input {
      width: 100%;
      padding: 10px;
      border: 2px solid #3f8fb4; 
      margin-bottom: 12px;
      border-radius: 5px;
      font-family: 'Lexend', sans-serif;
    }

    .login-body button {
      width: 100%;
      padding: 10px;
      background: #3f8fb4; 
      color: #fff;
      border: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      border-radius: 5px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .login-body button:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    /* ✨ EFECTO ESPEJO */
    .login-body button::after {
      content: "";
      position: absolute;
      top: 0; left: -75%;
      width: 50%; height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
      transform: skewX(-25deg);
      animation: brillo 2.5s infinite;
    }

    @keyframes brillo {
      0% { left: -75%; }
      100% { left: 125%; }
    }

    /* 🔹 MENSAJE DE ESTADO / ERROR */
    #mensaje-estado {
      margin-top: 10px;
      padding: 8px;
      font-size: 13px;
      border-radius: 5px;
      text-align: center;
      display: none;
    }

    /* 🔹 CONTENEDOR DE LA IMAGEN INFERIOR */
    .image-container {
      margin-top: 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    .image-container img {
      border-radius: 8px;
    }

    /* 🔹 PIE DE PÁGINA (FOOTER) */
    footer {
      width: 100%;
      background-color: #003366;
      color: #ffffff;
      text-align: center;
      padding: 20px 10px;
      font-size: 13px;
      line-height: 1.6;
    }

    footer p {
      margin: 2px 0;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    
    <!-- TARJETA DE LOGIN -->
    <div class="section-card login-card">
      <div class="header">OFICINA VIRTUAL</div>
      <div class="login-body">
        <form id="form-login">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" required placeholder="usuario@correo.com">

          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••">

          <button type="submit" id="btn-submit">Acceder</button>
        </form>

        <div id="mensaje-estado"></div>
      </div>
    </div>

    <hr class="separador">

    <!-- IMAGEN DEBAJO DEL LOGIN -->
    <div class="image-container">
      <img src="https://i.ibb.co/hRdrqtfh/Picsart-26-05-30-20-21-36-686.jpg" alt="Imagen descriptiva">
    </div>

  </div>

  <!-- PIE DE PÁGINA -->
  <footer>
    <p>© Akrocever 2026 | Proyecto independiente impulsado por IA</p>
    <p>Todos los derechos reservados.</p>
  </footer>

  <!-- LÓGICA CONEXIÓN CON SUPABASE -->
  <script>
    const SUPABASE_URL = 'https://atiihfgjbpvtjglestyw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_CpzuF8Op8fYh_9znf-tHXg_Ba9xNMnP';
    
    // Conexión oficial a Supabase
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const formLogin = document.getElementById('form-login');
    const mensajeEstado = document.getElementById('mensaje-estado');
    const btnSubmit = document.getElementById('btn-submit');
    const PAGINA_DEFECTO = 'https://akrocever.github.io/Sistema/Emp/0Encbzdo.html';

    // Si el usuario ya había iniciado sesión, lo redirige directo
    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        await redirigirUsuario(session.user.email);
      }
    });

    // Acción al presionar Acceder
    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      ocultarMensaje();

      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      btnSubmit.disabled = true;
      mostrarMensaje("Verificando datos...", "#ebf8ff", "#2b6cb0");

      // 1. Iniciar sesión con Supabase Auth
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        btnSubmit.disabled = false;
        mostrarMensaje("Error: " + error.message, "#fff5f5", "#c53030");
      } else {
        await redirigirUsuario(data.user.email);
      }
    });

    // 2. Buscar URL en la tabla usuarios_paginas y redirigir
    async function redirigirUsuario(email) {
      mostrarMensaje("Cargando tu oficina...", "#ebf8ff", "#2b6cb0");

      const emailLimpio = email.trim().toLowerCase();

      const { data, error } = await supabaseClient
        .from('usuarios_paginas')
        .select('pagina_privada')
        .eq('email', emailLimpio)
        .maybeSingle();

      if (error) {
        console.error("Error al consultar Supabase:", error);
      }

      // Si encuentra la página en la tabla se va ahí, si no, a la por defecto
      const urlFinal = data?.pagina_privada || PAGINA_DEFECTO;
      window.location.href = urlFinal;
    }

    function mostrarMensaje(texto, bgColor, textColor) {
      mensajeEstado.textContent = texto;
      mensajeEstado.style.backgroundColor = bgColor;
      mensajeEstado.style.color = textColor;
      mensajeEstado.style.display = 'block';
    }

    function ocultarMensaje() {
      mensajeEstado.style.display = 'none';
    }
  </script>

</body>
</html>
